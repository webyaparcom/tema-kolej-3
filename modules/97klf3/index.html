<section class="modulex-cagri-on-gorusme{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-cagri-on-gorusme-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* cagri-on-gorusme — cagri-adimlar adımları, cagri-iki-yol seçenek kartlarını yalnız gösterir; bu modül ailede ilk seçim etkileşimli çağrı — takvim yaprağı iskeleti, tek seçimli saat çipleri ve seçimi taşıyan bağlantı (cagri-whatsapp'ın sabit mesajından farklı). */
  .modulex-cagri-on-gorusme { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --yaziRenk--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-cagri-on-gorusme *, .modulex-cagri-on-gorusme *::before, .modulex-cagri-on-gorusme *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-cagri-on-gorusme :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-cagri-on-gorusme :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-cagri-on-gorusme :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-cagri-on-gorusme :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-cagri-on-gorusme img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-cagri-on-gorusme) img { height: auto; }
  .modulex-cagri-on-gorusme [hidden] { display: none !important; }
  .modulex-cagri-on-gorusme :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-cagri-on-gorusme :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-cagri-on-gorusme-ic { max-width: --max--; margin-inline: auto; }
  .modulex-cagri-on-gorusme-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-cagri-on-gorusme--bassiz .modulex-cagri-on-gorusme-bas { display: none; }
  .modulex-cagri-on-gorusme-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-cagri-on-gorusme-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-cagri-on-gorusme-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-cagri-on-gorusme-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-cagri-on-gorusme-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-cagri-on-gorusme-dugme:hover { transform: translateY(-2px); }
  .modulex-cagri-on-gorusme-dugme--ikincil { background: transparent; color: --yaziRenk--; border-color: --cizgi--; }
  .modulex-cagri-on-gorusme-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-cagri-on-gorusme-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-cagri-on-gorusme-duzen { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: clamp(28px, 5vw, 72px); align-items: center; }
  .modulex-cagri-on-gorusme-yazi { display: grid; gap: 14px; }
  .modulex-cagri-on-gorusme-gizli { display: flex; align-items: center; gap: 8px; color: --muted--; font-size: 0.92rem; }
  .modulex-cagri-on-gorusme-gikon { color: --accentInk--; font-size: 20px; }
  .modulex-cagri-on-gorusme-yaprak { position: relative; display: grid; gap: 18px; padding: 34px clamp(18px, 3vw, 32px) clamp(22px, 3vw, 32px); border: 1px solid --cizgi--; border-radius: --yuvarlak--; background: --kartBg--; box-shadow: 0 28px 50px -36px color-mix(in srgb, --yaziRenk-- 60%, transparent); transition: box-shadow 0.35s ease; }
  .modulex-cagri-on-gorusme-yaprak:hover { box-shadow: 0 36px 60px -36px color-mix(in srgb, --yaziRenk-- 70%, transparent); }
  .modulex-cagri-on-gorusme-yaprak::before { content: ""; position: absolute; inset-block-start: -9px; inset-inline: 16%; height: 18px; background: radial-gradient(circle, --accent-- 0 5px, transparent 6px) 0 0 / 36px 18px repeat-x; }
  .modulex-cagri-on-gorusme-yust { display: flex; align-items: center; gap: 12px; padding-block-end: 14px; border-block-end: 2px solid --accent--; }
  .modulex-cagri-on-gorusme-yikon { color: --accentInk--; font-size: 28px; }
  .modulex-cagri-on-gorusme-ybas { font-size: 1.05rem; font-weight: 750; }
  .modulex-cagri-on-gorusme-saatler { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 10px; }
  .modulex-cagri-on-gorusme-saat-cip { display: grid; gap: 2px; min-height: 56px; padding: 10px 14px; border: 1.5px solid --cizgi--; border-radius: 12px; background: transparent; color: --yaziRenk--; font: inherit; text-align: start; transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease, transform 0.2s ease; }
  .modulex-cagri-on-gorusme-saat-cip strong { font-weight: 700; font-variant-numeric: tabular-nums; }
  .modulex-cagri-on-gorusme-saat-cip small { color: --muted--; font-size: 0.82rem; }
  .modulex-cagri-on-gorusme-saat-cip:hover { border-color: --accent--; transform: translateY(-2px); }
  .modulex-cagri-on-gorusme-saat-cip[aria-pressed="true"] { border-color: --accent--; background: --accent--; color: --accentText--; }
  .modulex-cagri-on-gorusme-saat-cip[aria-pressed="true"] small { color: inherit; }
  .modulex-cagri-on-gorusme:not(.modulex-cagri-on-gorusme--csjs) .modulex-cagri-on-gorusme-saat-cip { cursor: default; }
  .modulex-cagri-on-gorusme-secilen { display: flex; align-items: center; gap: 8px; color: --accentInk--; font-weight: 700; }
  .modulex-cagri-on-gorusme-sikon { font-size: 20px; }
  .modulex-cagri-on-gorusme-eylem { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
  .modulex-cagri-on-gorusme-wa { display: inline-flex; align-items: center; gap: 8px; color: --yaziRenk--; font-weight: 700; text-decoration: none; transition: color 0.25s ease; }
  .modulex-cagri-on-gorusme-wa:hover { color: --accentInk--; }
  .modulex-cagri-on-gorusme-ikinci { color: --muted--; text-decoration: underline; text-underline-offset: 4px; }
  @media (max-width: 768px) {
    .modulex-cagri-on-gorusme-duzen { grid-template-columns: minmax(0, 1fr); }
  }
  .modulex-cagri-on-gorusme-wasvg { width: 1.25em; height: 1.25em; flex: none; }
  .modulex-cagri-on-gorusme-maddeler { display: grid; gap: 12px; }
  .modulex-cagri-on-gorusme-madde { display: flex; align-items: flex-start; gap: 12px; }
  .modulex-cagri-on-gorusme-mikon { flex: none; color: --accentInk--; font-size: 24px; }
  .modulex-cagri-on-gorusme-myazi { display: grid; gap: 2px; }
  .modulex-cagri-on-gorusme-myazi strong { font-weight: 700; }
  .modulex-cagri-on-gorusme-myazi small { color: --muted--; font-size: 0.92rem; }
  .modulex-cagri-on-gorusme-not { color: --muted--; font-size: 0.9rem; }
  .modulex-cagri-on-gorusme-saat { display: flex; align-items: center; gap: 8px; color: --muted--; font-size: 0.95rem; }
  .modulex-cagri-on-gorusme-saat .material-symbols-outlined { font-size: 20px; color: --accentInk--; }
  .modulex-cagri-on-gorusme-metin { max-width: 62ch; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-cagri-on-gorusme :is(.modulex-cagri-on-gorusme-baslik, .modulex-cagri-on-gorusme-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-cagri-on-gorusme-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-cagri-on-gorusme { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-cagri-on-gorusme *, .modulex-cagri-on-gorusme *::before, .modulex-cagri-on-gorusme *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-cagri-on-gorusme";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cagriSec = (s, P) => {
        const gruplar = [...s.querySelectorAll("[data-cs-grup]")];
        if (!gruplar.length) return;
        s.classList.add(P + "--csjs");
        const baglar = [...s.querySelectorAll("[data-cs-bag]")];
        baglar.forEach((a) => { a.dataset.csTaban = a.getAttribute("href") || ""; });
        const cipler = gruplar.flatMap((g) => [...g.querySelectorAll("[data-cs]")]);
        const paneller = [...s.querySelectorAll("[data-cs-panel]")];
        const bagla = (a, metin) => {
          const taban = a.dataset.csTaban;
          if (!metin || !taban) { a.setAttribute("href", taban); return; }
          let u;
          try { u = new URL(taban, location.href); } catch (x) { return; }
          const ek = a.dataset.csOnek ? a.dataset.csOnek + " " + metin : metin;
          if (u.protocol === "mailto:") u.searchParams.set("body", [u.searchParams.get("body") || "", ek].filter(Boolean).join("\n"));
          else if (/(^|\.)(wa\.me|whatsapp\.com)$/i.test(u.hostname)) u.searchParams.set("text", [u.searchParams.get("text") || "", ek].filter(Boolean).join("\n"));
          else u.searchParams.set(a.dataset.csParam || "secim", metin);
          a.setAttribute("href", u.href.replace(/\?[^#]*/, (q) => q.replace(/\+/g, "%20")));
        };
        const guncelle = () => {
          const secili = cipler.filter((c) => c.getAttribute("aria-pressed") === "true").map((c) => c.dataset.cs);
          const metin = secili.join(", ");
          s.querySelectorAll("[data-cs-cikti]").forEach((o) => { o.textContent = metin; const k = o.closest("[data-cs-kap]") || o; k.hidden = !metin; });
          paneller.forEach((p) => { p.hidden = !secili.includes(p.dataset.csPanel); });
          baglar.forEach((a) => bagla(a, metin));
          s.classList.toggle(P + "--secili", secili.length > 0);
        };
        gruplar.forEach((g) => {
          const coklu = g.dataset.csGrup === "coklu";
          const ic = [...g.querySelectorAll("[data-cs]")];
          ic.forEach((c) => c.addEventListener("click", () => {
            const acik = c.getAttribute("aria-pressed") === "true";
            if (!coklu) ic.forEach((x) => x.setAttribute("aria-pressed", "false"));
            c.setAttribute("aria-pressed", String(coklu ? !acik : true));
            guncelle();
          }));
        });
        guncelle();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cagriSec(s, P, az);
    });
  })();
</script>

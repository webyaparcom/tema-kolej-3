  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-referans-vaka-metrik :is(.modulex-referans-vaka-metrik-baslik, .modulex-referans-vaka-metrik-ust, h3, h4, strong) { letter-spacing: 0; }

  @media (prefers-reduced-motion: reduce) {

  }
</style>
<script>
  (() => {
    const P = "modulex-referans-vaka-metrik";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const vakaGecis = (s, P, az) => {
        const kartlar = [...s.querySelectorAll("[data-vaka]")];
        if (!kartlar.length) return;
        s.classList.add(P + "--vjs");
        const kur = (k, durum) => {
          k.classList.toggle(P + "-vaka--once", durum === "once");
          k.querySelectorAll("[data-vaka-gec]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.vakaGec === durum)));
        };
        kartlar.forEach((k) => k.querySelectorAll("[data-vaka-gec]").forEach((b) => b.addEventListener("click", () => { k.dataset.vakaEl = "1"; kur(k, b.dataset.vakaGec); })));
        if (az || !("IntersectionObserver" in window)) return;
        kartlar.forEach((k) => kur(k, "once"));
        const io = new IntersectionObserver((gs) => gs.forEach((g) => {
          if (!g.isIntersecting) return;
          io.unobserve(g.target);
          setTimeout(() => { if (!g.target.dataset.vakaEl) kur(g.target, "sonra"); }, 700);
        }), { threshold: 0.45 });
        kartlar.forEach((k) => io.observe(k));
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      vakaGecis(s, P, az);
    });
  })();
</script>
